<!-- ─── ADMIN DASHBOARD ───────────────────────────────────────── -->
<div class="max-w-4xl">
  <!-- Page header -->
  <div class="mb-8">
    <h1 class="font-display text-2xl text-foreground">DASHBOARD</h1>
    <p class="text-xs text-muted mt-1">Panel General</p>
  </div>

  <!-- Stats cards -->
  @if (loading()) {
    <div class="grid sm:grid-cols-2 gap-4">
      @for (_ of [1,2]; track $index) {
        <div class="bg-surface border border-border rounded-xl p-6 animate-pulse h-28"></div>
      }
    </div>
  } @else {
    <div class="grid sm:grid-cols-2 gap-4 mb-8">
      <!-- Products stat -->
      <a
        routerLink="/admin/products"
        id="card-stat-products"
        class="group bg-surface border border-border rounded-xl p-6 flex items-center gap-4
               hover:border-accent transition-all duration-200 hover:-translate-y-0.5"
      >
        <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/20
                    flex items-center justify-center text-accent
                    group-hover:bg-accent/20 transition-colors">
          <ng-icon name="heroSquares2x2" size="22" />
        </div>
        <div class="flex-1">
          <p class="text-2xl font-display text-foreground">{{ totalProducts() }}</p>
          <p class="text-xs text-muted font-medium">Productos</p>
        </div>
        <ng-icon name="heroArrowRight" size="18" class="text-muted group-hover:text-accent transition-colors" />
      </a>

      <!-- Categories stat -->
      <a
        routerLink="/admin/categories"
        id="card-stat-categories"
        class="group bg-surface border border-border rounded-xl p-6 flex items-center gap-4
               hover:border-accent transition-all duration-200 hover:-translate-y-0.5"
      >
        <div class="w-12 h-12 rounded-xl bg-accent/10 border border-accent/20
                    flex items-center justify-center text-accent
                    group-hover:bg-accent/20 transition-colors">
          <ng-icon name="heroTag" size="22" />
        </div>
        <div class="flex-1">
          <p class="text-2xl font-display text-foreground">{{ totalCategories() }}</p>
          <p class="text-xs text-muted font-medium">Categorías</p>
        </div>
        <ng-icon name="heroArrowRight" size="18" class="text-muted group-hover:text-accent transition-colors" />
      </a>
    </div>
  }

  <!-- Quick links -->
  <div class="bg-surface border border-border rounded-xl p-5">
    <p class="text-xs font-semibold uppercase tracking-wider text-muted mb-3">Acciones rápidas</p>
    <div class="flex flex-wrap gap-3">
      <a
        routerLink="/admin/products/new"
        id="btn-dash-new-product"
        class="text-sm px-4 py-2 bg-accent text-accent-fg font-semibold rounded-lg
               hover:shadow-[0_0_15px_var(--accent)] transition-all duration-200"
      >
        + Nuevo producto
      </a>
      <a
        routerLink="/admin/categories/new"
        id="btn-dash-new-category"
        class="text-sm px-4 py-2 bg-surface-2 border border-border text-foreground font-medium rounded-lg
               hover:border-accent hover:text-accent transition-all duration-200"
      >
        + Nueva categoría
      </a>
    </div>
  </div>
</div>

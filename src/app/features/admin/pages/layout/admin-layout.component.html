<!-- ─── ADMIN LAYOUT ──────────────────────────────────────────── -->
<div class="min-h-dvh bg-background flex flex-col md:flex-row">

  <!-- Mobile Top Bar (< md) -->
  <header class="md:hidden bg-surface border-b border-border px-4 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-2.5">
      <img src="logo.webp" alt="Rukasu Design" class="h-7 w-auto">
      <span class="font-display text-xs tracking-widest text-foreground">RUKASU ADMIN</span>
    </div>
    <button
      (click)="toggleMobile()"
      id="btn-admin-mobile-toggle"
      aria-label="Abrir menú admin"
      class="p-2 rounded-lg text-muted hover:text-foreground hover:bg-surface-2 transition-colors"
    >
      @if (isMobileOpen()) {
        <ng-icon name="heroXMark" size="22" />
      } @else {
        <ng-icon name="heroBars3" size="22" />
      }
    </button>
  </header>

  <!-- Mobile Backdrop & Drawer (< md) -->
  @if (isMobileOpen()) {
    <div
      (click)="closeMobile()"
      class="md:hidden fixed inset-0 z-40 bg-black/60 backdrop-blur-sm"
    ></div>
    <aside class="md:hidden fixed top-0 bottom-0 left-0 z-50 w-64 bg-surface border-r border-border flex flex-col shadow-2xl">
      <div class="px-5 py-5 border-b border-border flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <img src="logo.webp" alt="Rukasu Design" class="h-8 w-auto">
          <div>
            <p class="font-display text-[11px] tracking-widest text-foreground">RUKASU</p>
            <p class="font-mono text-[9px] text-accent tracking-widest">ADMIN</p>
          </div>
        </div>
        <button (click)="closeMobile()" aria-label="Cerrar menú" class="p-1 text-muted hover:text-foreground">
          <ng-icon name="heroXMark" size="20" />
        </button>
      </div>

      <nav class="flex-1 px-3 py-4 flex flex-col gap-1" aria-label="Menú admin móvil">
        <a
          routerLink="/admin/dashboard"
          (click)="closeMobile()"
          routerLinkActive="bg-accent/10 text-accent border-accent"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-muted border border-transparent hover:bg-surface-2 transition-all"
        >
          <ng-icon name="heroHome" size="17" />
          Dashboard
        </a>
        <a
          routerLink="/admin/products"
          (click)="closeMobile()"
          routerLinkActive="bg-accent/10 text-accent border-accent"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-muted border border-transparent hover:bg-surface-2 transition-all"
        >
          <ng-icon name="heroSquares2x2" size="17" />
          Productos
        </a>
        <a
          routerLink="/admin/categories"
          (click)="closeMobile()"
          routerLinkActive="bg-accent/10 text-accent border-accent"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-muted border border-transparent hover:bg-surface-2 transition-all"
        >
          <ng-icon name="heroTag" size="17" />
          Categorías
        </a>
      </nav>

      <div class="px-3 py-4 border-t border-border">
        <button
          (click)="logout(); closeMobile()"
          class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-sm text-muted hover:text-red-400 hover:bg-red-400/10 transition-all"
        >
          <ng-icon name="heroArrowRightOnRectangle" size="17" />
          Cerrar sesión
        </button>
      </div>
    </aside>
  }

  <!-- Desktop Permanent Sidebar (>= md) -->
  <aside class="hidden md:flex w-60 shrink-0 bg-surface border-r border-border flex-col min-h-dvh">
    <!-- Brand -->
    <div class="px-5 py-5 border-b border-border">
      <div class="flex items-center gap-2.5">
        <img src="logo.webp" alt="Rukasu Design" class="h-8 w-auto">
        <div>
          <p class="font-display text-[11px] tracking-widest text-foreground">RUKASU</p>
          <p class="font-mono text-[9px] text-accent tracking-widest">ADMIN</p>
        </div>
      </div>
    </div>

    <!-- Nav links -->
    <nav class="flex-1 px-3 py-4 flex flex-col gap-0.5" aria-label="Menú admin">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-accent/10 text-accent border-accent"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-muted border border-transparent
               hover:text-foreground hover:bg-surface-2 transition-all duration-150"
        id="nav-admin-dashboard"
      >
        <ng-icon name="heroHome" size="17" />
        Dashboard
      </a>
      <a
        routerLink="/admin/products"
        routerLinkActive="bg-accent/10 text-accent border-accent"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-muted border border-transparent
               hover:text-foreground hover:bg-surface-2 transition-all duration-150"
        id="nav-admin-products"
      >
        <ng-icon name="heroSquares2x2" size="17" />
        Productos
      </a>
      <a
        routerLink="/admin/categories"
        routerLinkActive="bg-accent/10 text-accent border-accent"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-muted border border-transparent
               hover:text-foreground hover:bg-surface-2 transition-all duration-150"
        id="nav-admin-categories"
      >
        <ng-icon name="heroTag" size="17" />
        Categorías
      </a>
    </nav>

    <!-- Logout -->
    <div class="px-3 py-4 border-t border-border">
      <button
        id="btn-admin-logout"
        (click)="logout()"
        class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-sm text-muted border border-transparent
               hover:text-red-400 hover:bg-red-400/10 transition-all duration-150"
      >
        <ng-icon name="heroArrowRightOnRectangle" size="17" />
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto p-4 sm:p-6 md:p-8 min-w-0">
    <router-outlet />
  </main>
</div>

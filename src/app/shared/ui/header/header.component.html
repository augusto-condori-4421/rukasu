<!-- ──────────────────────────────────────────────────────────
     HEADER — fixed, scroll-aware background, mobile-friendly
     ────────────────────────────────────────────────────────── -->
<header class="fixed top-0 inset-x-0 z-50 transition-all duration-300" [class.bg-surface]="isScrolled()"
  [class.border-b]="isScrolled()" [class.border-border]="isScrolled()" [class.backdrop-blur-md]="isScrolled()">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/" (click)="closeMobile()" class="flex items-center gap-2 group">
        <img src="logo.webp" alt="Rukasu Design logo"
          class="h-9 w-auto transition-transform duration-300 group-hover:scale-115 [filter:drop-shadow(0_0_16px_var(--accent))]">
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-6" aria-label="Navegación principal">
        <a routerLink="/" routerLinkActive="text-accent" [routerLinkActiveOptions]="{ exact: true }"
          class="text-sm font-medium text-muted hover:text-foreground transition-colors duration-200 tracking-wide uppercase">
          RUKASU
        </a>
      </nav>

      <!-- Actions -->
      <div class="flex items-center gap-2">

        <!-- WhatsApp button -->
        <a href="https://wa.me/5493888400162" target="_blank" rel="noopener noreferrer" id="btn-whatsapp-header"
          aria-label="Contactar por WhatsApp"
          class="p-2 rounded-lg text-accent hover:bg-surface-2 transition-all duration-200 flex items-center justify-center">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
          </svg>
        </a>

        <!-- Theme toggle -->
        <button id="btn-theme-toggle" (click)="toggleTheme()" aria-label="Cambiar tema"
          class="p-2 rounded-lg text-muted hover:text-accent hover:bg-surface-2 transition-all duration-200">
          @if (theme.isDark()) {
          <ng-icon name="heroSun" size="20" />
          } @else {
          <ng-icon name="heroMoon" size="20" />
          }
        </button>

        <!-- Cart button -->
        <button id="btn-cart" (click)="cart.toggleCart()" aria-label="Ver carrito"
          class="relative p-2 rounded-lg text-muted hover:text-accent hover:bg-surface-2 transition-all duration-200">
          <ng-icon name="heroShoppingCart" size="20" />
          @if (cart.totalUnits() > 0) {
          <span class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] flex items-center justify-center
                     text-[10px] font-bold rounded-full bg-accent text-accent-fg px-1
                     animate-[scale-in_0.2s_ease]">
            {{ cart.totalUnits() }}
          </span>
          }
        </button>

        <!-- Mobile menu toggle -->
        <button id="btn-mobile-menu" (click)="toggleMobile()" aria-label="Abrir menú"
          class="md:hidden p-2 rounded-lg text-muted hover:text-foreground hover:bg-surface-2 transition-all duration-200">
          @if (mobileMenuOpen()) {
          <ng-icon name="heroXMark" size="22" />
          } @else {
          <ng-icon name="heroBars3" size="22" />
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile dropdown nav -->
  @if (mobileMenuOpen()) {
  <div class="md:hidden border-t border-border bg-surface/95 backdrop-blur-md px-4 py-4 flex flex-col gap-2">
    <a routerLink="/" (click)="closeMobile()"
      class="block py-2 text-sm font-medium text-muted hover:text-accent transition-colors">
      Catálogo
    </a>
    <a href="https://wa.me/5493888400162" target="_blank" rel="noopener noreferrer" (click)="closeMobile()"
      class="flex items-center gap-2 py-2 text-sm font-medium text-accent hover:opacity-80 transition-opacity">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
      </svg>
      WhatsApp
    </a>
  </div>
  }
</header>
